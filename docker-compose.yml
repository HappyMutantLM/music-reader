version: "3.8"

services:
  # ── FastAPI Backend, E-ink Renderer + Library Watcher ────────
  music-reader-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-reader-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/db/music.db
      - PDF_DIR=/pdf
      - CACHE_DIR=/cache
      - LOG_DIR=/logs
      - PANEL_WIDTH=825
      - PANEL_HEIGHT=1200
      - CONTENT_WHITE_THRESHOLD=250
      # Include your dual-screen Pi and companion reader origins here:
      - ALLOWED_ORIGINS=http://localhost:5173,http://192.168.1.*
    volumes:
      - /volume1/music_scores:/pdf
      - /volume1/docker/music-reader/db:/db
      - /volume1/docker/music-reader/cache:/cache
      - /volume1/docker/music-reader/logs:/logs
    deploy:
      resources:
        limits:
          memory: 1024M

  # ── Dedicated Dropbox Intake & Renaming Worker ────────────────
  music-reader-dropbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-reader-dropbox
    restart: unless-stopped
    command: ["python", "dropbox_processor.py"]
    environment:
      - DROPBOX_DIR=/dropbox
      - PDF_DIR=/pdf
      - LOG_DIR=/logs
      - NEEDS_REVIEW_DIR=/dropbox/needs_review
    volumes:
      - /volume1/music_dropbox:/dropbox
      - /volume1/music_scores:/pdf
      - /volume1/docker/music-reader/logs:/logs
    deploy:
      resources:
        limits:
          memory: 512M
